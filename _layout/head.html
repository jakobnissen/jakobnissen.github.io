<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Set the theme before the page renders, to avoid a flash of the wrong theme.
    // Use the reader's saved choice (see header.html), else follow the OS setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var media = window.matchMedia("(prefers-color-scheme: dark)");
      function apply() {
        document.documentElement.dataset.theme = saved || (media.matches ? "dark" : "light");
      }
      apply();
      media.addEventListener("change", function () {
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        apply();
      });
    })();
  </script>
